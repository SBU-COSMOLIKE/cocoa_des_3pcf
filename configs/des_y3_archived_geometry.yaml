format: cosmolike-3pcf-run-v1
description: Y3 archived radial-bank and representative-side comparison; catalogue weighting
  unverified.
notes:
- Theory-convention comparison, not an exact measurement or posterior reproduction.
- Retain the original 20 logarithmic side bins from 0.5 to 80 arcmin; lower edges >=8 arcmin
  keep indices 11 through 19 on both axes.
- Use the archived 100 angle centers (j+0.5)*pi/100, distinct from the methods paper's stated
  63 angular bins.
- Use area-weighted representatives plus the archived empirical factor offset -0.015226. It
  applies to this radial width only.
- Use exact log(160)/20 rather than rounding the archived dlnt=0.253758.
- Scalar HEALPix nside=1024 window on all three Fourier legs, using ell=0..3071 and zero above;
  original within-bin triangle weights remain unavailable.
- Source, priors and covariance are the explicit TATT demonstration inputs. All 480 rows are
  kept; no published posterior claim is made.
