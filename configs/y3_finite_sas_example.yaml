format: cosmolike-3pcf-run-v1
description: Pinned Y3 finite-SAS comparison example with every 400 xi and 80 Map3
  row.
notes:
- The two mean files and 480x480 joint covariance are pinned public simulated Y3 inputs.
- All 480 rows are retained. Original scale masks, MOPED and Percival likelihood are
  not reproduced.
- The source n(z), interpolation, IA conventions, numerical grids and nuisance priors
  still require a publication comparison.
- The provided covariance is used as a fixed matrix. Its filename does not establish
  an independent-realization count.
- The point-angle rule and untapered transform reproduce declared historical discretization
  choices.
- ordered_legs=true preserves ordered tomographic IA legs; false is only an explicit
  historical transpose comparison.
- This comparison is not a validated DES-Y3 Fisher result.
- Signed ratios and the stretched shape chart avoid the documented raw-residual interpolation
  failure. The stretch is half ln(2 ell_max/ell_min); these starting grids still require
  estimator-specific refinement.
threads: 1
source:
  path: ../data/upstream_y3/data/dv/sim_2pt-NLA-cosmoCosmogrid-04Nov24.fits
  extension: nz_source
  nbin: 4
physics:
  tables: ../chains/y3_physics.npz
  cosmology_mode: camb
  kernel_nz: 201
  k:
    lower: 1.0e-05
    upper: 1000
    count: 256
    logarithmic: true
  z:
    lower: 0
    upper: 3
    count: 101
  los_z:
    lower: 0.005
    upper: 3
    count: 65
  halofit_version: takahashi
  source_interpolation: linear_midpoint
  source_readers: false
  table_boost: 8
  fit_nz: 33
parameters:
  omega_m: 0.29
  omega_b: 0.048
  h: 0.69
  ns: 0.97
  sigma8: 0.7719752988722927
  w0: -1
  wa: 0
  mnu: 0.0773
  num_massive_neutrinos: 3
  nnu: 3.046
  m1: 0
  m2: 0
  m3: 0
  m4: 0
  dz1: 0
  dz2: 0
  dz3: 0
  dz4: 0
ia:
  a1: 0.7
  eta1: -1.7
  a2: 0
  eta2: 0
  bta: 0
  ct: 0
  zpivot: 0.62
  c1rho: 0.01389
  power_mode: 0
  ct_mode: 0
  fb: 0
  suppress_only: 1
rows:
  mode: measurement
  two_point: ../data/upstream_y3/data/dv/sim_2pt-NLA-cosmoCosmogrid-04Nov24.fits
  aperture: ../data/upstream_y3/data/dv/sim_map3_emu-NLA-cosmoCosmogrid-24FEBRUARY2025_WITH_COV.fits
  assumed_angle_unit: arcmin
mean:
  aperture_estimator: finite_sas
  aperture_settings:
    theta_edges_arcmin:
      lower: 0.1
      upper: 120
      count: 21
      logarithmic: true
    phi_bins: 100
    angular_average: point
    ell_min: 0.01
    ell_max: 100000
    minimum_size: 512
    lmax: 20
    mmax: 20
    nmu: 64
    transform_options:
      projection: centroid
      window: false
      npsi: 200
      ordered_legs: true
      padding: 0
    projection_mode: prepared
    projection_batch_size: 4
    projection_settings:
      ell_min: 0.001
      ell_max: 300000
      epmu: 0.0001
      nr: 32
      nu: 24
      nv: 24
      np: 32
      npu_log: 24
      npu_linear: 24
      nell: 64
      npsi_log: 32
      npsi_linear: 32
      nmu_log: 32
      nmu_linear: 32
      lmax: 20
      reference_mode: false
      table_boost: 2
      multipole_boost: 2
      npsi: 80
      nshape: 160
      prepare_multipoles: 1
      shape_stretch: 10.10622010659021
      signed_baseline: 1
      residual_scaling: 1
      psi_scale: 0.02
  xi_settings:
    ell:
      lower: 1
      upper: 30000
      count: 256
      logarithmic: true
    theta_count: 16
    pair_weight: uniform_area
  two_point:
    mode: isolated_nla
covariance:
  mode: file
  path: ../data/upstream_y3/data/covariance/xip_xim_map3_covariance_8ARCMINCUT_25Feb25.fits
  estimator: finite_sas
fisher:
  steps:
    omega_m: 0.003
    sigma8: 0.005
    w0: 0.02
    wa: 0.04
    a1: 0.02
    eta1: 0.03
    m1: 0.001
    m2: 0.001
    m3: 0.001
    m4: 0.001
    dz1: 0.001
    dz2: 0.001
    dz3: 0.001
    dz4: 0.001
  priors: {}
  bounds:
    omega_m:
    - 0.1
    - 0.5
    sigma8:
    - 0.4
    - 1.2
  fom_pairs:
  - - w0
    - wa
  precision:
    mode: inverse
outputs:
  evaluate: ../chains/y3_finite_sas_mean.npz
  fisher: ../chains/y3_finite_sas_fisher.npz
