# Read PAPER_TARGETS.md and EXAMPLE_FISHER_IA.ipynb before interpreting results.
# Paths are relative to this YAML. No production calculation has been run.
format: cosmolike-3pcf-run-v1
description: DES Y3 joint NLA Fisher comparison using the same full public covariance and
  declared finite-SAS design.
notes:
- New forecast design, not a reproduction of either published posterior.
- Keep all 400 xi and 80 Map3 rows and every cross-covariance entry; no implicit scale cuts
  or MOPED.
- The published covariance applies an approximately 8 arcmin lower cut to BOTH measured
  SAS side parameters. Its aperture radii remain 7,14,25,40 arcmin.
- The explicit 8-to-80 arcmin, 10-side-bin, 63-angle-bin model below is a design approximation;
  exact retained measurement edges, bin averaging and emulator equivalence require validation.
- The public covariance is reused at fixed cosmology and NLA physics while the mean uses
  TATT. Connected IA covariance changes are omitted.
- All 400 xi rows include scales removed by the published two-point cuts. No claim of baryon
  robustness is valid before an explicit cut/model study.
- IA Table 1 fiducial choices follow2601.09133; source curves/covariance follow the public
  Y3 simulation files. This is deliberately a new mixed-input forecast.
- power_mode=2 means nonlinear P(k,z) in quadratic three-point IA. Compare mode0 and historical
  mode1 as distinct physical prescriptions.
- Photo-z and calibration Gaussian widths follow2503.03964 Table3. No Gaussian prior is
  inferred from a uniform parameter range.
- Velocity shear ct and bispectrum-only feedback fb are fixed to zero because the chosen
  two-point model has no corresponding complete joint response.
- BiHalofit and effective-growth neutrino approximations remain; mnu is fixed rather than
  forecast.
- Numerical grids are starting choices. Refine transforms, projection, CFASTPT, ell quadrature
  and derivative steps separately before interpreting errors.
- This reduced NLA run fixes a2,bta,eta2 and removes their derivative columns; it is conditional
  on the simpler IA model.
threads: 4
source:
  path: ../data/upstream_y3/data/dv/sim_2pt-NLA-cosmoCosmogrid-04Nov24.fits
  extension: nz_source
  nbin: 4
physics:
  tables: ../runs/y3_tatt_physics.npz
  cosmology_mode: camb
  kernel_nz: 201
  k:
    lower: 1.0e-05
    upper: 1000
    count: 256
    logarithmic: true
  z:
    lower: 0
    upper: 3
    count: 101
  los_z:
    lower: 0.005
    upper: 3
    count: 65
  halofit_version: takahashi
  source_interpolation: linear_midpoint
  source_readers: false
  table_boost: 8
  fit_nz: 33
parameters:
  omega_m: 0.289
  omega_b: 0.0463
  h: 0.722
  ns: 0.959
  sigma8: 0.7865548373195137
  w0: -1
  wa: 0
  mnu: 0.06
  num_massive_neutrinos: 3
  nnu: 3.046
  m1: 0
  m2: 0
  m3: 0
  m4: 0
  dz1: 0
  dz2: 0
  dz3: 0
  dz4: 0
ia:
  a1: -0.33
  eta1: 2.81
  a2: 0.0
  eta2: 0.0
  bta: 0.0
  ct: 0
  zpivot: 0.62
  c1rho: 0.0134
  power_mode: 2
  ct_mode: 0
  fb: 0
  suppress_only: 1
rows:
  mode: measurement
  two_point: ../data/upstream_y3/data/dv/sim_2pt-NLA-cosmoCosmogrid-04Nov24.fits
  aperture: ../data/upstream_y3/data/dv/sim_map3_emu-NLA-cosmoCosmogrid-24FEBRUARY2025_WITH_COV.fits
  assumed_angle_unit: arcmin
mean:
  aperture_estimator: finite_sas
  aperture_settings:
    theta_edges_arcmin:
      lower: 8.0
      upper: 80.0
      count: 11
      logarithmic: true
    phi_bins: 63
    angular_average: point
    ell_min: 0.01
    ell_max: 100000
    minimum_size: 512
    lmax: 20
    mmax: 20
    nmu: 64
    transform_options:
      projection: centroid
      window: false
      npsi: 200
      ordered_legs: true
      padding: 0
    projection_mode: prepared
    projection_batch_size: 4
    projection_settings:
      ell_min: 0.001
      ell_max: 300000
      epmu: 0.0001
      nr: 32
      nu: 24
      nv: 24
      np: 32
      npu_log: 24
      npu_linear: 24
      nell: 64
      npsi_log: 32
      npsi_linear: 32
      nmu_log: 32
      nmu_linear: 32
      lmax: 20
      reference_mode: false
      table_boost: 2
      multipole_boost: 2
      npsi: 80
      nshape: 160
      shape_stretch: 10.1062201
      signed_baseline: 1
      residual_scaling: 1
      psi_scale: 0.02
      prepare_multipoles: 1
  xi_settings:
    ell:
      lower: 1
      upper: 30000
      count: 256
      logarithmic: true
    theta_count: 16
    pair_weight: uniform_area
  two_point:
    mode: core_tatt
    directory: ../../des_y3/interface
    module: cosmolike_des_y3_interface
    interpolation_type: 1
    accuracy_boost: 1.0
    integration_accuracy: 0
    fpt_internal_boost: 0.5
    ell_internal: 192
covariance:
  mode: file
  path: ../data/upstream_y3/data/covariance/xip_xim_map3_covariance_8ARCMINCUT_25Feb25.fits
  estimator: finite_sas
  estimator_agreement: unvalidated_exact_sas_bin_support_and_weighting
  likelihood_interpretation: fixed_gaussian_forecast_no_finite_mock_correction
fisher:
  steps:
    omega_m: 0.003
    sigma8: 0.005
    omega_b: 0.0005
    h: 0.005
    ns: 0.005
    a1: 0.01
    eta1: 0.03
    m1: 0.001
    m2: 0.001
    m3: 0.001
    m4: 0.001
    dz1: 0.001
    dz2: 0.001
    dz3: 0.001
    dz4: 0.001
  priors:
    m1: 0.0091
    m2: 0.0078
    m3: 0.0076
    m4: 0.0076
    dz1: 0.018
    dz2: 0.015
    dz3: 0.011
    dz4: 0.017
  bounds:
    omega_m:
    - 0.1
    - 0.5
    sigma8:
    - 0.4
    - 1.2
    omega_b:
    - 0.03
    - 0.07
    h:
    - 0.55
    - 0.91
    ns:
    - 0.87
    - 1.07
  fom_pairs:
  - - omega_m
    - sigma8
  - - a1
    - eta1
  precision:
    mode: inverse
outputs:
  evaluate: ../runs/y3_nla_mean.npz
  fisher: ../runs/y3_nla_fisher.npz
