# Paths are relative to this file. Run only after the machine is quiet.
format: des3pcf-openmp-scaling-v2
seed: 137
points: 10
threads: [1, 4, 8]
# Each block uses a fresh CLI process and one separate, untimed warmup point.
thread_order: [4, 1, 8]
threepcf_nla_configuration: des_y3_nla_scaling.yaml
threepcf_tatt_configuration: des_y3_tatt_scaling.yaml
output: ../outputs/openmp_scaling_ia_extrapolated
child_timeout_seconds: 21600
