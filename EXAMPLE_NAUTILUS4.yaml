format: cosmolike-3pcf-inference-v1
description: Synthetic TATT example with explicit independent-pilot compression and Percival
  likelihood.
notes:
- Teaching configuration; not a reproduction of the published estimator, priors, compression
  or posterior.
- Run EXAMPLE_COMPRESSION.ipynb to create the fixed independent-pilot matrix; its historical
  derivative basis is not a current accuracy validation.
- Ns=796 and independent Gaussian mocks are explicit approximations. Four footprints from
  one full sky need an independence assessment.
- The ordinary supplied sample covariance is used without Hartlap or PME correction. Compression
  is applied to data, mean and both covariance axes.
- The baseline synthetic mean uses recorded source clipping. All 480 rows enter before explicit
  compression; no hidden scale cut is made.
- Uniform sigma8 and the demonstration priors differ from published inference. Posterior reproduction
  is not established.
prediction: configs/des_y3_tatt_demo_fisher.yaml
projection_overrides:
  signed_baseline: 1
threads: 1
data:
  mode: synthetic_fiducial
selection:
  mode: all
initial:
  w0: -1.0
  wa: 0.0
  m1: -0.0063
  m2: -0.0198
  m3: -0.0241
  m4: -0.0369
priors:
  omega_m:
    distribution: uniform
    minimum: 0.1
    maximum: 0.5
    latex: \Omega_{\rm m}
  omega_b:
    distribution: uniform
    minimum: 0.03
    maximum: 0.07
    latex: \Omega_{\rm b}
  h:
    distribution: uniform
    minimum: 0.55
    maximum: 0.91
    latex: h
  ns:
    distribution: uniform
    minimum: 0.87
    maximum: 1.07
    latex: n_{\rm s}
  sigma8:
    distribution: uniform
    minimum: 0.6
    maximum: 1.0
    latex: \sigma_8
  a1:
    distribution: uniform
    minimum: -5.0
    maximum: 5.0
    latex: A_1
  eta1:
    distribution: uniform
    minimum: -5.0
    maximum: 5.0
    latex: \eta_1
  m1:
    distribution: normal
    mean: -0.0063
    sigma: 0.0091
    minimum: -0.1
    maximum: 0.1
    latex: m_1
  m2:
    distribution: normal
    mean: -0.0198
    sigma: 0.0078
    minimum: -0.1
    maximum: 0.1
    latex: m_2
  m3:
    distribution: normal
    mean: -0.0241
    sigma: 0.0076
    minimum: -0.1
    maximum: 0.1
    latex: m_3
  m4:
    distribution: normal
    mean: -0.0369
    sigma: 0.0076
    minimum: -0.1
    maximum: 0.1
    latex: m_4
  dz1:
    distribution: normal
    mean: 0.0
    sigma: 0.018
    minimum: -0.1
    maximum: 0.1
    latex: \Delta z_1
  dz2:
    distribution: normal
    mean: 0.0
    sigma: 0.015
    minimum: -0.1
    maximum: 0.1
    latex: \Delta z_2
  dz3:
    distribution: normal
    mean: 0.0
    sigma: 0.011
    minimum: -0.1
    maximum: 0.1
    latex: \Delta z_3
  dz4:
    distribution: normal
    mean: 0.0
    sigma: 0.017
    minimum: -0.1
    maximum: 0.1
    latex: \Delta z_4
  a2:
    distribution: uniform
    minimum: -5.0
    maximum: 5.0
    latex: A_2
  eta2:
    distribution: uniform
    minimum: -5.0
    maximum: 5.0
    latex: \eta_2
  bta:
    distribution: uniform
    minimum: 0.0
    maximum: 2.0
    latex: b_{\rm TA}
check:
  parameter: a1
  delta: 0.01
sampler:
  n_live: 1000
  n_networks: 4
  n_eff: 10000
  n_like_max: 100000
  f_live: 0.01
  seed: 137
output: runs/nautilus_tatt_percival_teaching
compression:
  mode: file
  path: runs/independent_pilot_compression.npz
likelihood:
  mode: percival
  mock_count: 796
  assumptions:
    covariance_kind: sample
    independent_mocks: true
    independent_data: true
    gaussian_mocks: true
    compression_independent: true
